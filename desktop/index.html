<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP nền (bản web). App desktop gắn thêm CSP qua header với connect-src CHỈ gồm máy chủ đã cấu hình
         (electron/main.cjs) — hai chính sách cùng áp dụng nên kết quả là giao của chúng. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: http: https: ws: wss:; img-src 'self' data: blob:; media-src 'self' blob:;" />
    <title>ReaChat</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#0f9f7f" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
