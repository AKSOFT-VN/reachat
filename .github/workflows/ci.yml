name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Server suites + desktop unit tests
        run: npm test
      - name: Build web / desktop UI
        run: npm --workspace desktop run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --workspace desktop run build
      - name: Assemble build context
        run: |
          mkdir -p ctx/server
          cp -r server/package.json server/src server/scripts server/admin server/legal ctx/server/
          cp -r desktop/dist ctx/web
          cp deploy/Dockerfile ctx/
      - run: docker build -t reachat:ci ctx
      - name: Container starts and is healthy
        run: |
          docker run -d --name reachat -p 4000:4000 reachat:ci
          for i in $(seq 1 30); do curl -fs localhost:4000/health && exit 0; sleep 2; done
          docker logs reachat; exit 1
